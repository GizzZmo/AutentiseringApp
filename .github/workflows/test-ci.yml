name: CI/CD Testing for AutentiseringApp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: 🚀 Sjekk ut repository
        uses: actions/checkout@v3

      - name: 🛠 Sett opp Swift-miljø
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: 📦 Cache Swift Dependencies
        uses: actions/cache@v3
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 📦 Installer avhengigheter
        run: swift package resolve

      - name: ✅ Kjør enhetstester
        run: swift test

      - name: 📤 Send Slack-varsler ved suksess
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          sh Scripts/slack_notify.sh "Tests passed on ${{ github.ref }} at ${{ github.sha }}"

      - name: 📤 Send Slack-varsler ved feil
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          sh Scripts/slack_notify.sh "Tests failed on ${{ github.ref }} at ${{ github.sha }}"

# Documentation and comments for clarity
# - Swift dependency caching is enabled for faster builds.
# - Slack notifications are sent on both success and failure (when webhook is configured).

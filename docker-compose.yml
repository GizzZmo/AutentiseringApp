version: "3.8"
services:
  web:
    image: autentisering-app:latest
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_USER=${DB_USER:-defaultuser}
      - DB_PASSWORD=${DB_PASSWORD:-defaultpass}
      - API_KEY=${API_KEY:-defaultkey}
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
